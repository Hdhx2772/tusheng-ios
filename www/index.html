<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>图生万物</title>
<style>
:root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #000000;
    --text-secondary: #8e8e93;
    --accent: #007aff;
    --border: #e5e5ea;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
    display: flex; flex-direction: column; padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
}
/* 导航栏 */
.nav-bar {
    height: 44px; display: flex; align-items: center; justify-content: center;
    background: var(--bg); border-bottom: 0.5px solid var(--border); flex-shrink: 0;
    font-size: 17px; font-weight: 600;
}
/* 主内容区 */
.content { flex: 1; display: flex; flex-direction: column; padding: 12px; gap: 10px; overflow: hidden; }
/* 卡片 */
.card { background: var(--card); border-radius: 12px; padding: 14px; }
/* 上传区域 */
.upload-card {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; min-height: 0;
}
.upload-card:active { background: #f0f0f5; }
.upload-icon { width: 48px; height: 48px; margin-bottom: 8px; color: var(--accent); }
.upload-title { font-size: 16px; font-weight: 500; color: var(--accent); }
.upload-hint { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
/* 预览 */
.preview-card { flex: 1; display: none; flex-direction: column; min-height: 0; }
.preview-card.show { display: flex; }
.preview-img { width: 100%; flex: 1; min-height: 0; object-fit: contain; border-radius: 8px; background: #f5f5f5; }
.preview-actions { display: flex; gap: 8px; margin-top: 8px; }
/* 输入区 */
.input-card { padding: 0; overflow: hidden; }
.input-row { padding: 12px 14px; border-bottom: 0.5px solid var(--border); }
.input-row:last-child { border-bottom: none; }
.input-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
.prompt-input {
    width: 100; border: none; outline: none; font-size: 16px; background: transparent;
    font-family: inherit; resize: none; min-height: 60px; color: var(--text);
}
.chip-group { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
    padding: 5px 12px; background: var(--bg); border-radius: 16px;
    font-size: 13px; color: var(--accent); cursor: pointer;
}
.chip:active { background: #e0e0e8; }
/* 按钮 */
.btn {
    padding: 12px; border-radius: 12px; font-size: 16px; font-weight: 600;
    border: none; cursor: pointer; font-family: inherit; flex-shrink: 0;
}
.btn:active { opacity: 0.7; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-secondary { background: var(--bg); color: var(--accent); }
.btn-danger { background: #ff3b30; color: #fff; }
.btn-success { background: #34c759; color: #fff; }
/* 加载 */
.loading-card {
    flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; min-height: 150px;
}
.loading-card.show { display: flex; }
.spinner {
    width: 32px; height: 32px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 15px; color: var(--text); font-weight: 500; }
.loading-sub { font-size: 13px; color: var(--text-secondary); }
/* 结果 */
.result-card { flex: 1; display: none; flex-direction: column; min-height: 0; }
.result-card.show { display: flex; }
.result-slider {
    position: relative; width: 100%; flex: 1; min-height: 150px; border-radius: 8px;
    overflow: hidden; background: #f5f5f5; touch-action: none;
}
.result-after, .result-before { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
.result-before-wrap { position: absolute; top: 0; left: 0; height: 100%; width: 50%; overflow: hidden; }
.result-handle {
    position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 2px; background: #fff; z-index: 10;
}
.result-handle::after {
    content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 28px; height: 28px; border-radius: 50%; background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.result-hint {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.6); color: #fff; padding: 6px 12px; border-radius: 12px;
    font-size: 12px; z-index: 20; pointer-events: none;
}
.result-actions { display: flex; gap: 8px; margin-top: 10px; }
.result-actions button { flex: 1; }
/* 历史 */
.history-page { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.history-page.active { display: flex; }
.history-header {
    padding: 10px 14px; display: flex; justify-content: space-between; align-items: center;
}
.history-title { font-size: 22px; font-weight: 700; }
.history-clear { font-size: 15px; color: #ff3b30; background: none; border: none; cursor: pointer; }
.history-grid { flex: 1; padding: 0 12px; overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.history-item { aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #e5e5ea; cursor: pointer; }
.history-item img { width: 100%; height: 100%; object-fit: cover; }
.history-empty { text-align: center; padding: 60px 20px; color: var(--text-secondary); grid-column: 1/-1; }
/* Tab Bar */
.tab-bar {
    height: 49px; background: rgba(249,249,249,0.95); backdrop-filter: blur(20px);
    border-top: 0.5px solid var(--border); display: flex; flex-shrink: 0;
    padding-bottom: env(safe-area-inset-bottom);
}
.tab-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; cursor: pointer; color: var(--text-secondary);
}
.tab-item.active { color: var(--accent); }
.tab-item svg { width: 24px; height: 24px; }
.tab-item span { font-size: 10px; font-weight: 500; }
/* 弹窗 */
.modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4); z-index: 1000; display: none;
    align-items: flex-end; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
    background: var(--card); border-radius: 16px 16px 0 0; width: 100%;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); max-height: 80vh;
    overflow-y: auto;
}
.modal-title { font-size: 17px; font-weight: 600; text-align: center; margin-bottom: 12px; }
.modal-body { font-size: 15px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 16px; }
.modal-actions { display: flex; gap: 8px; }
.modal-actions button { flex: 1; }
/* 居中弹窗 */
.modal-center { align-items: center; }
.modal-center .modal { border-radius: 16px; margin: 20px; padding: 24px 20px; }
/* Toast */
.toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8); color: #fff; padding: 12px 20px; border-radius: 12px;
    font-size: 14px; z-index: 2000; display: none; max-width: 80%; text-align: center;
}
.toast.show { display: block; }
/* 授权码 */
.auth-code {
    font-size: 16px; font-weight: 600; color: var(--text); background: var(--bg);
    border-radius: 8px; padding: 12px; margin: 12px 0; text-align: center;
    font-family: monospace; word-break: break-all;
}
/* 隐藏文件输入 */
#fileInput { display: none; }
</style>
<script src="capacitor.js"></script>

</head>
<body>
<div class="toast" id="toast"></div>

<!-- 导航栏 -->
<div class="nav-bar">图生万物</div>

<!-- 创作页 -->
<div class="content" id="pageCreate">
    <div class="card upload-card" id="uploadCard" onclick="selectImage()">
        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
        </svg>
        <div class="upload-title">选择图片</div>
        <div class="upload-hint">从相册选择需要编辑的图片</div>
    </div>
    <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp">
    <div class="card preview-card" id="previewCard">
        <img class="preview-img" id="previewImg" src="" alt="">
        <div class="preview-actions">
            <button class="btn btn-secondary" onclick="selectImage()">重新选择</button>
            <button class="btn btn-danger" onclick="removeImage()">移除</button>
        </div>
    </div>
    <div class="card input-card" id="inputCard">
        <div class="input-row">
            <div class="input-label">修改描述</div>
            <textarea class="prompt-input" id="promptInput" placeholder="描述你想要的效果..." rows="2"></textarea>
        </div>
        <div class="input-row">
            <div class="chip-group">
                <span class="chip" onclick="setPreset('移除背景')">移除背景</span>
                <span class="chip" onclick="setPreset('增强清晰度')">增强清晰度</span>
                <span class="chip" onclick="setPreset('动漫风格')">动漫风格</span>
                <span class="chip" onclick="setPreset('换海边背景')">换背景</span>
                <span class="chip" onclick="setPreset('去水印')">去水印</span>
            </div>
        </div>
    </div>
    <button class="btn btn-primary" id="generateBtn" onclick="submitEdit()">开始生成</button>
    <div class="card loading-card" id="loadingCard">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">AI 正在处理...</div>
        <div class="loading-sub" id="loadingSub">请稍候</div>
    </div>
    <div class="card result-card" id="resultCard">
        <div class="result-slider" id="resultSlider">
            <img class="result-after" id="resultAfter" src="">
            <div class="result-before-wrap" id="resultBeforeWrap">
                <img class="result-before" id="resultBefore" src="">
            </div>
            <div class="result-handle" id="resultHandle"></div>
            <div class="result-hint" id="resultHint">左右滑动对比</div>
        </div>
        <div class="result-actions">
            <button class="btn btn-success" onclick="downloadResult()">保存</button>
            <button class="btn btn-secondary" onclick="resetAll()">重新创作</button>
        </div>
    </div>
</div>

<!-- 历史页 -->
<div class="history-page" id="pageHistory">
    <div class="history-header">
        <div class="history-title">历史记录</div>
        <button class="history-clear" onclick="clearHistory()">清空</button>
    </div>
    <div class="history-grid" id="historyGrid"></div>
</div>

<!-- Tab Bar -->
<div class="tab-bar">
    <div class="tab-item active" id="tabCreate" onclick="switchTab('create')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
        </svg>
        <span>创作</span>
    </div>
    <div class="tab-item" id="tabHistory" onclick="switchTab('history')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
        </svg>
        <span>历史</span>
    </div>
</div>

<!-- 免责声明 -->
<div class="modal-overlay modal-center" id="disclaimerModal">
    <div class="modal">
        <div class="modal-title">用户协议与免责声明</div>
        <div class="modal-body" style="max-height:40vh;overflow-y:auto;font-size:13px;">
            <p style="margin-bottom:8px;">1. 本应用仅供学习交流使用，严禁用于任何违法违规用途。</p>
            <p style="margin-bottom:8px;">2. 严禁生成色情、暴力、政治敏感、侵犯他人权益等内容。</p>
            <p style="margin-bottom:8px;">3. 用户使用本应用产生的一切后果由用户自行承担。</p>
            <p style="margin-bottom:8px;">4. 本应用不对生成结果做任何保证。</p>
            <p>5. 使用即视为同意以上全部条款。</p>
        </div>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="disagreeDisclaimer()">不同意</button>
            <button class="btn btn-primary" onclick="agreeDisclaimer()">同意并继续</button>
        </div>
    </div>
</div>

<!-- 未授权弹窗 -->
<div class="modal-overlay modal-center" id="authModal">
    <div class="modal">
        <div class="modal-title">设备未授权</div>
        <div class="modal-body" style="text-align:center;">请将以下授权码发给作者开通</div>
        <div class="auth-code" id="authCode">DEV_xxxx</div>
        <div class="modal-actions">
            <button class="btn btn-primary" onclick="copyAuthCode()">复制授权码</button>
            <button class="btn btn-secondary" onclick="closeAuthModal()">我知道了</button>
        </div>
    </div>
</div>

<!-- 封禁弹窗 -->
<div class="modal-overlay modal-center" id="banModal">
    <div class="modal">
        <div class="modal-title" style="color:#ff3b30;">设备已封禁</div>
        <div class="modal-body" id="banReason" style="text-align:center;">违反使用规则</div>
        <div class="modal-actions">
            <button class="btn btn-danger" style="flex:1;" onclick="closeBanModal()">我知道了</button>
        </div>
    </div>
</div>

<!-- 确认弹窗 -->
<div class="modal-overlay modal-center" id="confirmOverlay">
    <div class="modal">
        <div class="modal-title">确认操作</div>
        <div class="modal-body" id="confirmText" style="text-align:center;"></div>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeConfirm()">取消</button>
            <button class="btn btn-danger" id="confirmOkBtn">确定</button>
        </div>
    </div>
</div>

<!-- 历史详情弹窗 -->
<div class="modal-overlay modal-center" id="modalOverlay">
    <div class="modal">
        <img id="modalImg" src="" style="width:100%;border-radius:8px;margin-bottom:12px;max-height:40vh;object-fit:contain;">
        <div class="modal-body" id="modalPrompt" style="font-size:13px;max-height:60px;overflow-y:auto;"></div>
        <div class="modal-actions">
            <button class="btn btn-success" onclick="saveFromHistory()">保存</button>
            <button class="btn btn-danger" onclick="deleteFromHistory()">删除</button>
            <button class="btn btn-secondary" onclick="closeModal()">关闭</button>
        </div>
    </div>
</div>

<script>
var selectedFile = null;
var resultImageUrl = null;
var currentHistoryIndex = -1;
var API_BASE = 'https://wutong.xyz';
var APP_VERSION = '1.1';

function showToast(msg, dur) {
    dur = dur || 2000;
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, dur);
}

function getDeviceCode() {
    var code = localStorage.getItem('dev_code');
    if (!code) {
        code = 'DEV_' + Math.random().toString(16).substring(2,10) + Math.random().toString(16).substring(2,10);
        localStorage.setItem('dev_code', code);
    }
    return code;
}

var fileInput = document.getElementById('fileInput');
fileInput.addEventListener('change', function(e) {
    if (e.target.files.length > 0) handleFile(e.target.files[0]);
});

function selectImage() { fileInput.click(); }

function handleFile(file) {
    var allowed = ['image/jpeg','image/png','image/webp'];
    if (allowed.indexOf(file.type) === -1) { showToast('只支持 JPG、PNG、WebP'); return; }
    if (file.size > 10*1024*1024) { showToast('图片不能超过 10MB'); return; }
    selectedFile = file;
    var reader = new FileReader();
    reader.onload = function(e) {
        document.getElementById('previewImg').src = e.target.result;
        document.getElementById('uploadCard').style.display = 'none';
        document.getElementById('previewCard').classList.add('show');
    };
    reader.readAsDataURL(file);
}

function removeImage() {
    selectedFile = null;
    fileInput.value = '';
    document.getElementById('previewCard').classList.remove('show');
    document.getElementById('uploadCard').style.display = 'flex';
}

function setPreset(text) {
    document.getElementById('promptInput').value = text;
}

function switchTab(tab) {
    if (tab === 'create') {
        document.getElementById('pageCreate').style.display = 'flex';
        document.getElementById('pageHistory').classList.remove('active');
        document.getElementById('tabCreate').classList.add('active');
        document.getElementById('tabHistory').classList.remove('active');
    } else {
        document.getElementById('pageCreate').style.display = 'none';
        document.getElementById('pageHistory').classList.add('active');
        document.getElementById('tabCreate').classList.remove('active');
        document.getElementById('tabHistory').classList.add('active');
        loadHistory();
    }
}

function submitEdit() {
    if (!selectedFile) { showToast('请先选择图片'); return; }
    var prompt = document.getElementById('promptInput').value.trim();
    if (!prompt) { showToast('请输入修改描述'); return; }
    var devCode = getDeviceCode();
    showToast('检查授权...', 1000);
    var xhrAuth = new XMLHttpRequest();
    xhrAuth.open('POST', API_BASE + '/api_ai_record.php', true);
    xhrAuth.timeout = 15000;
    xhrAuth.onload = function() {
        try {
            var authData = JSON.parse(xhrAuth.responseText);
            if (authData.status === 'banned') { showBanModal(authData.reason); return; }
            if (!authData.authorized) { showAuthModal(); return; }
            doGenerate(prompt);
        } catch(e) {
            showToast('授权解析错误: ' + xhrAuth.responseText.substring(0,100));
        }
    };
    xhrAuth.onerror = function() { showToast('授权网络异常，请检查网络'); };
    xhrAuth.ontimeout = function() { showToast('授权检查超时，请重试'); };
    var fdAuth = new FormData();
    fdAuth.append('action', 'check_auth');
    fdAuth.append('device_id', devCode);
    xhrAuth.send(fdAuth);
}

function doGenerate(prompt) {
    document.getElementById('uploadCard').style.display = 'none';
    document.getElementById('previewCard').classList.remove('show');
    document.getElementById('inputCard').style.display = 'none';
    document.getElementById('generateBtn').style.display = 'none';
    document.getElementById('loadingCard').classList.add('show');
    setLoading('正在上传图片...', '');
    var startTime = Date.now();
    var fd = new FormData();
    fd.append('image', selectedFile);
    fd.append('prompt', prompt);
    debugLog('开始上传图片...');
    var xhrUpload = new XMLHttpRequest();
    xhrUpload.open('POST', API_BASE + '/ai_edit.php', true);
    xhrUpload.timeout = 120000;
    xhrUpload.onload = function() {
        var raw = xhrUpload.responseText;
        debugLog('上传返回: ' + raw.substring(0,150));
        try {
            var data = JSON.parse(raw);
            var taskId = data.taskId || data.task_id || '';
            debugLog('解析后: taskId=' + (taskId || '未找到'));
            if (data.error) { showToast('失败：' + data.error, 3000); resetUI(); return; }
            if (!taskId) { showToast('失败：未获取到任务ID', 3000); resetUI(); return; }
            setLoading('AI 正在处理...', '');
            var pollCount = 0;
            function poll() {
                pollCount++;
                debugLog('轮询第' + pollCount + '次 taskId=' + taskId);
                var xhrPoll = new XMLHttpRequest();
                xhrPoll.open('GET', API_BASE + '/ai_edit.php?action=status&taskId=' + encodeURIComponent(taskId), true);
                xhrPoll.timeout = 30000;
                xhrPoll.onload = function() {
                    var raw2 = xhrPoll.responseText;
                    debugLog('轮询返回: ' + raw2.substring(0,100));
                    try {
                        var sData = JSON.parse(raw2);
                        if (sData.status === 'completed') {
                            var elapsed = Math.round((Date.now()-startTime)/1000);
                            showToast('完成，用时 ' + elapsed + ' 秒', 2500);
                            var resultUrl = sData.image || sData.result_url || sData.output_url || sData.image_url || sData.url || (sData.images && sData.images[0]) || '';
                            debugLog('结果URL: ' + resultUrl + ' 完整响应: ' + JSON.stringify(sData).substring(0,300));
                            if (!resultUrl) { showToast('未获取到结果图片', 3000); resetUI(); return; }
                            var hist = JSON.parse(localStorage.getItem('edit_history') || '[]');
                            hist.unshift({ prompt: prompt, imagePath: resultUrl });
                            localStorage.setItem('edit_history', JSON.stringify(hist.slice(0,50)));
                            showResult(resultUrl);
                            return;
                        }
                        if (sData.status === 'failed') { showToast('失败：' + (sData.error || '生成失败'), 3000); resetUI(); return; }
                        if (sData.error) { showToast('失败：' + sData.error, 3000); resetUI(); return; }
                        if (pollCount >= 80) { showToast('生成超时，请稍后重试', 3000); resetUI(); return; }
                        setTimeout(poll, 1500);
                    } catch(e) {
                        showToast('轮询解析错误: ' + raw2.substring(0,100), 3000); resetUI();
                    }
                };
                xhrPoll.onerror = function() { showToast('轮询网络异常', 3000); resetUI(); };
                xhrPoll.ontimeout = function() { showToast('轮询超时', 3000); resetUI(); };
                xhrPoll.send();
            }
            poll();
        } catch(e) {
            showToast('上传解析错误: ' + raw.substring(0,100), 3000); resetUI();
        }
    };
    xhrUpload.onerror = function() { showToast('上传网络异常，请检查网络', 3000); resetUI(); };
    xhrUpload.ontimeout = function() { showToast('上传超时，请重试', 3000); resetUI(); };
    xhrUpload.send(fd);
}

function setLoading(t, s) {
    document.getElementById('loadingText').textContent = t;
    document.getElementById('loadingSub').textContent = s;
    // 调试信息
    var dbg = document.getElementById('debugBox');
    if (!dbg) {
        dbg = document.createElement('div');
        dbg.id = 'debugBox';
        dbg.style.cssText = 'position:fixed;bottom:60px;left:10px;right:10px;z-index:99999;background:rgba(0,0,0,0.85);color:#0f0;padding:8px;border-radius:8px;font-size:11px;font-family:monospace;max-height:120px;overflow-y:auto;';
        document.body.appendChild(dbg);
    }
    var time = new Date().toLocaleTimeString();
    dbg.innerHTML += '<br>[' + time + '] ' + t + (s ? ' (' + s + ')' : '');
    dbg.scrollTop = dbg.scrollHeight;
}

function debugLog(msg) {
    var dbg = document.getElementById('debugBox');
    if (!dbg) {
        dbg = document.createElement('div');
        dbg.id = 'debugBox';
        dbg.style.cssText = 'position:fixed;bottom:60px;left:10px;right:10px;z-index:99999;background:rgba(0,0,0,0.85);color:#0f0;padding:8px;border-radius:8px;font-size:11px;font-family:monospace;max-height:120px;overflow-y:auto;';
        document.body.appendChild(dbg);
    }
    var time = new Date().toLocaleTimeString();
    dbg.innerHTML += '<br>[' + time + '] ' + msg;
    dbg.scrollTop = dbg.scrollHeight;
}

function resetUI() {
    document.getElementById('loadingCard').classList.remove('show');
    document.getElementById('inputCard').style.display = 'block';
    document.getElementById('generateBtn').style.display = 'block';
    if (selectedFile) {
        document.getElementById('previewCard').classList.add('show');
    } else {
        document.getElementById('uploadCard').style.display = 'flex';
    }
}

function showAuthModal() {
    document.getElementById('authCode').textContent = getDeviceCode();
    document.getElementById('authModal').classList.add('show');
}
function closeAuthModal() { document.getElementById('authModal').classList.remove('show'); }
function copyAuthCode() {
    var code = document.getElementById('authCode').textContent;
    if (navigator.clipboard) { navigator.clipboard.writeText(code); showToast('已复制'); }
    else { showToast('请长按复制'); }
}
function showBanModal(reason) {
    document.getElementById('banReason').textContent = reason || '违反使用规则';
    document.getElementById('banModal').classList.add('show');
}
function closeBanModal() { document.getElementById('banModal').classList.remove('show'); }

function showResult(url) {
    resultImageUrl = url;
    document.getElementById('loadingCard').classList.remove('show');
    document.getElementById('resultCard').classList.add('show');
    document.getElementById('resultAfter').src = url;
    document.getElementById('resultBefore').src = document.getElementById('previewImg').src;
    document.getElementById('resultBeforeWrap').style.width = '50%';
    document.getElementById('resultHandle').style.left = '50%';
    initSlider();
}

var isDragging = false;
function initSlider() {
    var slider = document.getElementById('resultSlider');
    var beforeWrap = document.getElementById('resultBeforeWrap');
    var handle = document.getElementById('resultHandle');
    if (!slider || !beforeWrap || !handle) return;

    function updateSlider(clientX) {
        var rect = slider.getBoundingClientRect();
        var percent = ((clientX - rect.left) / rect.width) * 100;
        percent = Math.max(0, Math.min(100, percent));
        beforeWrap.style.width = percent + '%';
        handle.style.left = percent + '%';
    }

    slider.addEventListener('touchstart', function(e) {
        isDragging = true;
        updateSlider(e.touches[0].clientX);
        e.preventDefault();
    }, { passive: false });

    slider.addEventListener('touchmove', function(e) {
        if (isDragging) {
            updateSlider(e.touches[0].clientX);
            e.preventDefault();
        }
    }, { passive: false });

    slider.addEventListener('touchend', function() { isDragging = false; });

    slider.addEventListener('mousedown', function(e) {
        isDragging = true;
        updateSlider(e.clientX);
        e.preventDefault();
    });

    document.addEventListener('mousemove', function(e) {
        if (isDragging) updateSlider(e.clientX);
    });

    document.addEventListener('mouseup', function() { isDragging = false; });
}

function downloadResult() {
    if (resultImageUrl) { window.open(resultImageUrl); showToast('已开始下载'); }
}

function resetAll() {
    selectedFile = null;
    fileInput.value = '';
    document.getElementById('promptInput').value = '';
    document.getElementById('resultCard').classList.remove('show');
    document.getElementById('inputCard').style.display = 'block';
    document.getElementById('generateBtn').style.display = 'block';
    document.getElementById('uploadCard').style.display = 'flex';
}

function loadHistory() {
    var hist = JSON.parse(localStorage.getItem('edit_history') || '[]');
    var grid = document.getElementById('historyGrid');
    grid.innerHTML = '';
    if (hist.length === 0) {
        grid.innerHTML = '<div class="history-empty">还没有历史记录<br>去创作一张吧</div>';
        return;
    }
    hist.forEach(function(item, idx) {
        var div = document.createElement('div');
        div.className = 'history-item';
        div.onclick = function(){ openHistory(idx); };
        var img = document.createElement('img');
        img.src = item.imagePath || '';
        div.appendChild(img);
        grid.appendChild(div);
    });
}

function openHistory(idx) {
    var hist = JSON.parse(localStorage.getItem('edit_history') || '[]');
    if (!hist[idx]) return;
    currentHistoryIndex = idx;
    document.getElementById('modalImg').src = hist[idx].imagePath || '';
    document.getElementById('modalPrompt').textContent = hist[idx].prompt || '无描述';
    document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }
function saveFromHistory() {
    var hist = JSON.parse(localStorage.getItem('edit_history') || '[]');
    if (hist[currentHistoryIndex]) { window.open(hist[currentHistoryIndex].imagePath); showToast('已下载'); }
}
function deleteFromHistory() {
    var hist = JSON.parse(localStorage.getItem('edit_history') || '[]');
    hist.splice(currentHistoryIndex, 1);
    localStorage.setItem('edit_history', JSON.stringify(hist));
    closeModal();
    loadHistory();
    showToast('已删除');
}

function clearHistory() {
    showConfirm('确定清空所有历史记录吗？', function(){
        localStorage.removeItem('edit_history');
        loadHistory();
        showToast('已清空');
    });
}

var confirmCb = null;
function showConfirm(text, cb) {
    document.getElementById('confirmText').textContent = text;
    confirmCb = cb;
    document.getElementById('confirmOverlay').classList.add('show');
}
function closeConfirm() {
    document.getElementById('confirmOverlay').classList.remove('show');
    confirmCb = null;
}
document.getElementById('confirmOkBtn').onclick = function() {
    if (confirmCb) confirmCb();
    closeConfirm();
};

function agreeDisclaimer() { document.getElementById('disclaimerModal').classList.remove('show'); }
function disagreeDisclaimer() {
    if (confirm('确定退出吗？')) window.close();
}

window.addEventListener('load', function() {
    document.getElementById('disclaimerModal').classList.add('show');
    checkServerConfig();
});

function checkServerConfig() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', API_BASE + '/ai_edit.php?action=config', true);
    xhr.timeout = 10000;
    xhr.onload = function() {
        try {
            var cfg = JSON.parse(xhr.responseText);
            if (cfg.kill_switch) {
                showToast('应用已停用', 3000);
                setTimeout(function() { window.close(); }, 1000);
                return;
            }
            if (cfg.generation_disabled) {
                var btn = document.getElementById('generateBtn');
                if (btn) { btn.disabled = true; btn.textContent = '生成已暂停'; btn.style.opacity = '0.5'; }
            }
            if (cfg.min_version && cfg.min_version !== APP_VERSION) {
                showUpdateModal(cfg.update_url || '');
                return;
            }
            if (cfg.announcement) {
                showAnnouncementModal(cfg.announcement);
            }
        } catch(e) { console.log('配置解析失败'); }
    };
    xhr.onerror = function() { console.log('配置获取失败'); };
    xhr.ontimeout = function() { console.log('配置获取超时'); };
    xhr.send();
}

function showAnnouncementModal(text) {
    var modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
    modal.innerHTML = '<div style="background:#fff;border-radius:16px;padding:24px;max-width:320px;width:100%;"><h3 style="margin:0 0 12px;font-size:18px;">公告</h3><p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#333;white-space:pre-wrap;">' + text + '</p><button id="annCloseBtn" style="width:100%;padding:12px;background:#007AFF;color:#fff;border:none;border-radius:10px;font-size:16px;">我知道了</button></div>';
    document.body.appendChild(modal);
    document.getElementById('annCloseBtn').onclick = function() { document.body.removeChild(modal); };
}

function showUpdateModal(url) {
    var modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
    modal.innerHTML = '<div style="background:#fff;border-radius:16px;padding:24px;max-width:320px;width:100%;"><h3 style="margin:0 0 12px;font-size:18px;">发现新版本</h3><p style="margin:0 0 20px;font-size:15px;color:#333;">当前版本过低，请更新后使用</p><button id="updateBtn" style="width:100%;padding:12px;background:#007AFF;color:#fff;border:none;border-radius:10px;font-size:16px;">立即更新</button></div>';
    document.body.appendChild(modal);
    document.getElementById('updateBtn').onclick = function() {
        if (url) { window.open(url); }
        else { showToast('请联系管理员获取更新', 2000); }
    };
}
</script>
